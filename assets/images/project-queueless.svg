<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="qlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1726"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="qlOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9D00"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#qlBg)"/>
  
  <!-- Dashboard Card -->
  <rect x="40" y="30" width="720" height="440" rx="12" fill="#0B132B" stroke="#1E293B" stroke-width="1.5"/>
  
  <!-- Top Bar -->
  <rect x="40" y="30" width="720" height="56" rx="12" fill="#111C38"/>
  <circle cx="70" cy="58" r="14" fill="url(#qlOrange)"/>
  <text x="70" y="63" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="900" font-size="14" text-anchor="middle">Q</text>
  <text x="96" y="63" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="700" font-size="16">QueueLess AI</text>
  <text x="210" y="63" fill="#64748B" font-family="'Inter', sans-serif" font-size="12">Smart Hospital Waiting-Time Prediction</text>

  <rect x="620" y="46" width="120" height="24" rx="12" fill="rgba(6, 182, 212, 0.15)"/>
  <circle cx="632" cy="58" r="4" fill="#06B6D4"/>
  <text x="682" y="62" fill="#06B6D4" font-family="'Inter', sans-serif" font-weight="600" font-size="11" text-anchor="middle">OPD LIVE</text>

  <!-- Left Column: Token & Wait Time Prediction -->
  <rect x="65" y="105" width="310" height="200" rx="10" fill="#152144" stroke="#1E2E5D" stroke-width="1"/>
  <text x="85" y="135" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">DIGITAL TOKEN #</text>
  <text x="85" y="175" fill="#FF9D00" font-family="'Outfit', sans-serif" font-weight="900" font-size="36">OPD - 042</text>
  <text x="85" y="205" fill="#E2E8F0" font-family="'Inter', sans-serif" font-weight="600" font-size="13">Department: General Medicine</text>
  <text x="85" y="225" fill="#64748B" font-family="'Inter', sans-serif" font-size="11">Estimated Wait Time (AI Predicted):</text>
  
  <rect x="85" y="240" width="270" height="42" rx="8" fill="#1C2B59"/>
  <text x="100" y="266" fill="#38BDF8" font-family="'Outfit', sans-serif" font-weight="700" font-size="18">~14 Minutes</text>
  <text x="330" y="265" fill="#10B981" font-family="'Inter', sans-serif" font-weight="600" font-size="11" text-anchor="end">4 ahead</text>

  <!-- Right Column: Multi-Channel Accessibility -->
  <rect x="400" y="105" width="335" height="200" rx="10" fill="#152144" stroke="#1E2E5D" stroke-width="1"/>
  <text x="420" y="135" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">ACCESSIBILITY CHANNELS</text>
  
  <!-- Smartphone App -->
  <rect x="420" y="150" width="295" height="38" rx="6" fill="#1E2E5D"/>
  <text x="435" y="174" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="12">📱 Smartphone Web App &amp; Real-time Token</text>
  
  <!-- Keypad Phone / IVR -->
  <rect x="420" y="196" width="295" height="38" rx="6" fill="#1E2E5D"/>
  <text x="435" y="220" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="12">📞 Keypad Phone / IVR Call-In Status</text>
  
  <!-- Voice Reminders -->
  <rect x="420" y="242" width="295" height="38" rx="6" fill="#1E2E5D"/>
  <text x="435" y="266" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="12">🗣️ Automated Voice Reminders &amp; Alerts</text>

  <!-- Bottom Row: Flow Management -->
  <rect x="65" y="325" width="670" height="120" rx="10" fill="#111B38" stroke="#1E2E5D" stroke-width="1"/>
  <text x="90" y="355" fill="#E2E8F0" font-family="'Outfit', sans-serif" font-weight="700" font-size="14">AI Outpatient Flow &amp; Queue Management</text>
  
  <!-- Queue Step Circles -->
  <circle cx="120" cy="395" r="16" fill="#10B981"/>
  <text x="120" y="400" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="700" font-size="11" text-anchor="middle">✓</text>
  <text x="120" y="425" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Token Issued</text>

  <line x1="140" y1="395" x2="270" y2="395" stroke="#10B981" stroke-width="2"/>

  <circle cx="290" cy="395" r="16" fill="#10B981"/>
  <text x="290" y="400" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="700" font-size="11" text-anchor="middle">✓</text>
  <text x="290" y="425" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Triage</text>

  <line x1="310" y1="395" x2="450" y2="395" stroke="#FF9D00" stroke-width="2"/>

  <circle cx="470" cy="395" r="16" fill="#FF9D00"/>
  <text x="470" y="400" fill="#111C38" font-family="'Inter', sans-serif" font-weight="700" font-size="11" text-anchor="middle">⏳</text>
  <text x="470" y="425" fill="#FF9D00" font-family="'Inter', sans-serif" font-weight="700" font-size="10" text-anchor="middle">Consultation</text>

  <line x1="490" y1="395" x2="620" y2="395" stroke="#334155" stroke-width="2"/>

  <circle cx="640" cy="395" r="16" fill="#1E293B"/>
  <text x="640" y="400" fill="#64748B" font-family="'Inter', sans-serif" font-weight="700" font-size="11" text-anchor="middle">4</text>
  <text x="640" y="425" fill="#64748B" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Pharmacy</text>
</svg>