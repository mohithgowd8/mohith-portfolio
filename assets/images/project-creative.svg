<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCreative" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1612"/>
      <stop offset="100%" stop-color="#0E0B08"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9D00"/>
      <stop offset="50%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FFA826"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgCreative)"/>
  
  <!-- Video Editor UI Mockup -->
  <g transform="translate(50, 40)">
    <rect width="700" height="420" rx="18" fill="#18130E" stroke="#382C22" stroke-width="2"/>
    
    <!-- Top toolbar -->
    <rect width="700" height="45" rx="18" fill="#221B14"/>
    <text x="25" y="28" font-family="'Outfit', sans-serif" font-weight="900" font-size="15" fill="#FF9D00">NOVA STUDIO PRO</text>
    <rect x="180" y="10" width="280" height="25" rx="6" fill="#15100B"/>
    <text x="200" y="27" font-family="'Inter', sans-serif" font-size="11" fill="#A89E94">Sequence_Final_Cut_4K_HDR.mp4</text>
    <rect x="600" y="10" width="75" height="25" rx="12" fill="#FF9D00"/>
    <text x="637" y="27" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#110C08" text-anchor="middle">RENDER ➔</text>

    <!-- Video Preview Monitor -->
    <rect x="20" y="60" width="450" height="230" rx="12" fill="#0A0806" stroke="#2D231A"/>
    <circle cx="245" cy="175" r="45" fill="url(#waveGrad)" opacity="0.8"/>
    <polygon points="237,160 260,175 237,190" fill="#FFF"/>
    <text x="40" y="90" font-family="'Inter', sans-serif" font-size="11" fill="#888">REC ● 00:04:18:22</text>
    <text x="390" y="90" font-family="'Inter', sans-serif" font-size="11" fill="#FF9D00">60 FPS 4K</text>

    <!-- Side Inspector Panel -->
    <rect x="485" y="60" width="195" height="230" rx="12" fill="#1F1812" stroke="#2D231A"/>
    <text x="500" y="85" font-family="'Outfit', sans-serif" font-weight="800" font-size="13" fill="#FFF">Color Grading (LUTs)</text>
    <rect x="500" y="100" width="165" height="28" rx="6" fill="#FF9D00" fill-opacity="0.15" stroke="#FF9D00"/>
    <text x="515" y="118" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#FF9D00">Kinetic Warm Cinematic</text>
    
    <text x="500" y="150" font-family="'Inter', sans-serif" font-size="11" fill="#A89E94">Motion Tracking: Active</text>
    <text x="500" y="172" font-family="'Inter', sans-serif" font-size="11" fill="#A89E94">AI Speech Clean: 98%</text>
    <text x="500" y="194" font-family="'Inter', sans-serif" font-size="11" fill="#A89E94">Keyframe Smoothing: Bezier</text>
    <rect x="500" y="225" width="165" height="40" rx="8" fill="#2C2218"/>
    <text x="582" y="250" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" fill="#FFF" text-anchor="middle">Export XML to Premiere</text>

    <!-- Multi-track Timeline -->
    <rect x="20" y="305" width="660" height="95" rx="10" fill="#140F0B" stroke="#2D231A"/>
    <!-- Track 1 Video -->
    <rect x="35" y="318" width="50" height="20" rx="4" fill="#3D3025"/>
    <text x="60" y="332" font-family="'Inter', sans-serif" font-size="9" fill="#BBB" text-anchor="middle">V1 Video</text>
    <rect x="95" y="318" width="180" height="20" rx="4" fill="#C96B1E"/>
    <rect x="285" y="318" width="240" height="20" rx="4" fill="#E88B2A"/>
    <rect x="535" y="318" width="120" height="20" rx="4" fill="#C96B1E"/>

    <!-- Track 2 Audio Waveform -->
    <rect x="35" y="348" width="50" height="20" rx="4" fill="#3D3025"/>
    <text x="60" y="362" font-family="'Inter', sans-serif" font-size="9" fill="#BBB" text-anchor="middle">A1 Audio</text>
    <rect x="95" y="348" width="560" height="20" rx="4" fill="#1C3829" stroke="#2BB673" stroke-width="1"/>
    <!-- Audio Wave lines -->
    <path d="M 100 358 Q 110 350, 120 358 T 140 358 T 160 358 T 180 358 T 200 358 T 220 358 T 240 358 T 260 358 T 280 358 T 300 358 T 320 358 T 340 358 T 360 358 T 380 358 T 400 358 T 420 358 T 440 358 T 460 358 T 480 358 T 500 358 T 520 358 T 540 358 T 560 358 T 580 358 T 600 358 T 620 358 T 640 358" stroke="#2BB673" stroke-width="2" fill="none"/>

    <!-- Playhead line -->
    <line x1="320" y1="300" x2="320" y2="400" stroke="#FF9D00" stroke-width="2"/>
    <polygon points="315,300 325,300 320,310" fill="#FF9D00"/>
  </g>
</svg>
