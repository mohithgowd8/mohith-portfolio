<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBakery" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1F18"/>
      <stop offset="50%" stop-color="#1F1510"/>
      <stop offset="100%" stop-color="#140D0A"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#F4ECE1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bgBakery)"/>
  
  <!-- Subtle decorative grid -->
  <g opacity="0.08" stroke="#FF9D00" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Mobile Screen 1 -->
  <g transform="translate(140, 50)" filter="url(#shadow)">
    <rect width="220" height="420" rx="32" fill="#111" stroke="#333" stroke-width="4"/>
    <rect x="8" y="8" width="204" height="404" rx="26" fill="url(#cardGrad)"/>
    <rect x="75" y="14" width="70" height="12" rx="6" fill="#111"/>
    
    <!-- Screen content -->
    <text x="24" y="55" font-family="'Outfit', sans-serif" font-weight="800" font-size="14" fill="#1A110B">Good Morning ☕</text>
    <text x="24" y="75" font-family="'Outfit', sans-serif" font-weight="900" font-size="18" fill="#1A110B">Artisan Bakes</text>
    <rect x="24" y="90" width="172" height="32" rx="16" fill="#EDE4D6"/>
    <text x="40" y="111" font-family="'Inter', sans-serif" font-size="11" fill="#887C70">🔍 Search croissants, tarts...</text>
    
    <!-- Product card 1 -->
    <rect x="24" y="135" width="172" height="110" rx="16" fill="#FF9D00" fill-opacity="0.15" stroke="#FF9D00" stroke-width="1.5"/>
    <circle cx="110" cy="175" r="30" fill="#E88B00"/>
    <text x="110" y="183" font-family="'Outfit', sans-serif" font-weight="900" font-size="24" fill="#FFF" text-anchor="middle">🥐</text>
    <text x="36" y="228" font-family="'Outfit', sans-serif" font-weight="800" font-size="13" fill="#1A110B">French Butter Croissant</text>
    <text x="165" y="228" font-family="'Outfit', sans-serif" font-weight="900" font-size="13" fill="#E88B00">$4.50</text>

    <!-- Product card 2 -->
    <rect x="24" y="260" width="172" height="100" rx="16" fill="#FFFFFF" stroke="#E3DACD" stroke-width="1.5"/>
    <circle cx="110" cy="295" r="24" fill="#C97034"/>
    <text x="110" y="303" font-family="'Outfit', sans-serif" font-weight="900" font-size="20" fill="#FFF" text-anchor="middle">🥖</text>
    <text x="36" y="342" font-family="'Outfit', sans-serif" font-weight="800" font-size="12" fill="#1A110B">Sourdough Loaf</text>
    <text x="165" y="342" font-family="'Outfit', sans-serif" font-weight="900" font-size="12" fill="#C97034">$6.20</text>

    <!-- Bottom nav -->
    <rect x="24" y="375" width="172" height="24" rx="12" fill="#1A110B"/>
    <circle cx="50" cy="387" r="5" fill="#FF9D00"/>
    <circle cx="90" cy="387" r="5" fill="#777"/>
    <circle cx="130" cy="387" r="5" fill="#777"/>
    <circle cx="170" cy="387" r="5" fill="#777"/>
  </g>

  <!-- Mobile Screen 2 (Overlapping) -->
  <g transform="translate(420, 30)" filter="url(#shadow)">
    <rect width="230" height="440" rx="34" fill="#0D0907" stroke="#443" stroke-width="4"/>
    <rect x="8" y="8" width="214" height="424" rx="28" fill="#1F1712"/>
    <rect x="80" y="16" width="70" height="12" rx="6" fill="#0D0907"/>

    <!-- Screen content -->
    <circle cx="45" cy="65" r="18" fill="#FF9D00"/>
    <text x="45" y="72" font-family="'Inter', sans-serif" font-weight="800" font-size="16" fill="#FFF" text-anchor="middle">←</text>
    <text x="115" y="70" font-family="'Outfit', sans-serif" font-weight="800" font-size="14" fill="#FFF" text-anchor="middle">Cart &amp; Checkout</text>
    
    <rect x="24" y="105" width="182" height="150" rx="20" fill="#2B211A" stroke="#FF9D00" stroke-width="1.5"/>
    <text x="115" y="160" font-family="'Outfit', sans-serif" font-weight="900" font-size="44" fill="#FFF" text-anchor="middle">🎂</text>
    <text x="115" y="200" font-family="'Outfit', sans-serif" font-weight="800" font-size="15" fill="#FFF" text-anchor="middle">Berry Velour Cake</text>
    <text x="115" y="222" font-family="'Outfit', sans-serif" font-weight="700" font-size="13" fill="#FF9D00" text-anchor="middle">★★★★★ (148 reviews)</text>

    <!-- Details -->
    <rect x="24" y="270" width="182" height="70" rx="14" fill="#281F18"/>
    <text x="40" y="295" font-family="'Inter', sans-serif" font-size="11" fill="#A89B8F">Delivery Time: 25 mins</text>
    <text x="40" y="315" font-family="'Inter', sans-serif" font-size="11" fill="#A89B8F">Freshly Baked Daily</text>
    <text x="40" y="333" font-family="'Outfit', sans-serif" font-weight="900" font-size="16" fill="#FF9D00">$28.50</text>

    <!-- Order button -->
    <rect x="24" y="360" width="182" height="48" rx="24" fill="#FF9D00"/>
    <text x="115" y="390" font-family="'Outfit', sans-serif" font-weight="800" font-size="15" fill="#140D0A" text-anchor="middle">Confirm Order ➔</text>
  </g>
</svg>
